seed: 17 # reproducibility only; not a measurement
token_bytes_per_token: 4 # ASSUMPTION: the stand-in counts 4 bytes as one token
limit_model: token_bucket # results/raw/limit_refill_analysis.json: reset = used / refill rate on 332 real responses
base_delay_ms: 0 # per-step latency below replaces a flat delay
load_delay_per_inflight_ms: 0 # NOT MEASURED (needs experiment E4): the stand-in's biggest unvalidated assumption
slow_success_probability: 0.0 # the slow tail is per step, below
slow_success_extra_ms: 0
failure_5xx_probability: 0.0 # 0 HTTP 5xx in 333 real calls (budget_ledger.csv); the one 'error' row was a transport failure
failure_5xx_status: 503 # used only by the chaos profile
hang_probability: 0.0 # no hang observed in 333 real calls
hang_duration_ms: 30000 # used only by the chaos profile
chunk_chars: 8 # stand-in stream chunk width; not measured
stream_chunk_delay_ms: 0 # streamed steps are paced from ms_per_output_token below
reply_prefix: "Stand-in reply: "
