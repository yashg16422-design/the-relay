- id: Q27
  question: How do the delayed streams and teacher-forced inputs differ between Moshi's
    streaming TTS and ASR?
  type: multi_hop
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 31
    excerpt: we train a streaming TTS model by delaying audio tokens by 2 seconds,
      giving some lookahead to the text tokens, and teacher forcing text tokens at
      inference. Similarly, we train a streaming ASR model by delaying text tokens
      by 2 seconds, allowing the model to listen to audio content before generating
      text tokens. In that case, at inference we teacher force the audio tokens.
