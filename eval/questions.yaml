- id: Q23
  question: How does scaled dot-product attention turn a query and keys into weights
    on values?
  type: multi_hop
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 4
    excerpt: We compute the dot products of the query with all keys, divide each by
      √dk, and apply a softmax function to obtain the weights on the values.
- id: Q24
  question: How does the Transformer decoder prevent a position from using future
    output positions?
  type: multi_hop
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 5
    excerpt: We need to prevent leftward information flow in the decoder to preserve
      the auto-regressive property. We implement this inside of scaled dot-product
      attention by masking out (setting to −∞) all values in the input of the softmax
      which correspond to illegal connections.
