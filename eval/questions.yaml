# 35 source-verified evaluation questions. Accepted with eval/gold_answers.md on 2026-11-11. Type labels remain as written there.
questions:
- id: Q01
  question: What architecture did the authors propose, and which common operations
    does it dispense with?
  type: direct_fact
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 1
    excerpt: We propose a new simple network architecture, the Transformer, based
      solely on attention mechanisms, dispensing with recurrence and convolutions
      entirely.
- id: Q02
  question: How many identical layers are in the Transformer encoder stack?
  type: direct_fact
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 3
    excerpt: The encoder is composed of a stack of N = 6 identical layers.
- id: Q03
  question: What additional sub-layer does each Transformer decoder layer have beyond
    the encoder's two sub-layers?
  type: direct_fact
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 3
    excerpt: the decoder inserts a third sub-layer, which performs multi-head attention
      over the output of the encoder stack.
- id: Q04
  question: What three main components make up Moshi's architecture?
  type: direct_fact
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 6
    excerpt: 'The main components of Moshi’s architecture are: a bespoke text language
      model backbone (Helium, see Section 3.2); a neural audio codec with residual
      vector quantization and with semantic knowledge distilled from a self-supervised
      speech model (Mimi, Section 3.3); the streaming, hierarchical generation of
      semantic and acoustic tokens for both the user and Moshi, along with time-aligned
      text tokens for Moshi when using Inner Monologue (Section 3.4).'
- id: Q05
  question: Which spoken-conversation behaviors do the authors say turn-based models
    miss?
  type: direct_fact
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 2
    excerpt: it falls short in modeling aspects of spoken conversations such as interruptions,
      overlapping speech— which amounts for 10 to 20% of spoken time (C¸etin and Shriberg,
      2006) —and backchanneling (i.e. non-interrupting interjections such as “OK”
      or “I see”).
