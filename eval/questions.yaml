- id: Q13
  question: How many Mimi RVQ quantizers and codebook entries per quantizer correspond
    to the reported 1.1 kbps bitrate at 12.5 Hz?
  type: numeric_method
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 11
    excerpt: use Q = 8 quantizers, each with a codebook size of NA = 2048. At 12.5Hz,
      this represents a bitrate of 1.1kbps.
- id: Q14
  question: What theoretical latency did Moshi report, and what natural-conversation
    average did it compare against?
  type: numeric_method
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 2
    excerpt: 160 ms—lower than the 230 ms average in natural conversations measured
      over 10 languages (Stivers et al., 2009).
- id: Q15
  question: Why do the Transformer authors say scaled dot-product attention is faster
    and more space-efficient than additive attention in practice?
  type: comparison_synthesis
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 4
    excerpt: dot-product attention is much faster and more space-efficient in practice,
      since it can be implemented using highly optimized matrix multiplication code.
