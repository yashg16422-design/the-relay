- id: Q17
  question: What limitation of dGSLM does Moshi address, and what design choice does
    it use to address it?
  type: comparison_synthesis
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 6
    excerpt: 'While dGSLM is full-duplex, it remains a proof-of-concept: it does not
      run in an online fashion, it does not benefit from the knowledge of a text language
      model, and it does not model acoustic information as it only models semantic
      tokens. Moshi addresses these limitations altogether: by modeling two streams
      of semantic and acoustic tokens hierarchically, Moshi is full duplex and can
      exploit all the information from the user (linguistic and non-linguistic) while
      producing speech in real time.'
- id: Q18
  question: How did Moshi's streaming TTS WER compare with Vall-E and NaturalSpeech
    3, and what lookahead did Moshi need?
  type: comparison_synthesis
  answerable: true
  gold_passages:
  - paper_id: 2410.00037v1
    page_number: 31
    excerpt: Our streaming TTS model obtains 4.7% of WER on LibriSpeech test-clean,
      which outperforms Vall-E’s 5.9% WER but is worse than NaturalSpeech 3 (Ju et
      al., 2024) with 1.81%. Yet, Moshi only requires 2 seconds of lookahead
- id: Q19
  question: What does the H-Net pooling ablation suggest about fixed-width chunking?
  type: comparison_synthesis
  answerable: true
  gold_passages:
  - paper_id: 2507.07955v2
    page_number: 12
    excerpt: H-Net (pool) is much worse than all other H-Net variants, validating
      that fixed-width chunking is not effective.
- id: Q20
  question: At Large and XL scales, how did SpaceByte++ and H-Net variants compare
    with the BPE Transformer on average downstream performance?
  type: comparison_synthesis
  answerable: true
  gold_passages:
  - paper_id: 2507.07955v2
    page_number: 12
    excerpt: SpaceByte++, H-Net (space), and H-Net (1-stage) all have similar performance
      to the BPE Transformer at Large scale, and slightly outperform it at the XL
      scale, consistent with their close training curves (and possibly reflecting
      some noise in the evaluations). H-Net (2-stage) consistently achieves the highest
      performance across most tasks, outperforming 2.2% and 2.6% over the Transformer
      baseline at Large and XL scales respectively.
- id: Q21
  question: How did the Transformer big model compare with earlier reported models
    on WMT 2014 English-to-French?
  type: comparison_synthesis
  answerable: true
  gold_passages:
  - paper_id: 1706.03762v7
    page_number: 8
    excerpt: On the WMT 2014 English-to-French translation task, our big model achieves
      a BLEU score of 41.0, outperforming all of the previously published single models,
      at less than 1/4 the training cost of the previous state-of-the-art model.
